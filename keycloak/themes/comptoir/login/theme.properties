# Login pages of the shop: the official keycloak.v2 theme (PatternFly 5), restyled to the look of Comptoir.
# Only the style, the French wording and the footer are overridden: templates, form ids and accessibility stay those
# of Keycloak, which keeps upgrades safe.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/comptoir.css

# The shop has no dark theme: the login pages look the same as the shop, whatever the system setting.
darkMode=false
