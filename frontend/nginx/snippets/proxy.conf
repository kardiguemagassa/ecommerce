# To the API: the address the browser used, so Spring builds its redirects (OAuth2 login, logout) on it
# (server.forward-headers-strategy: native, trusted from private networks only).
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $forwarded_port;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
# The security headers are nginx's (security-headers.conf), not duplicated by the API's.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
