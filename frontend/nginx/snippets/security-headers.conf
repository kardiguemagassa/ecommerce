# Security headers of every response of the shop. Included in each location: a location with its own add_header
# would otherwise drop the server-level ones.
#   script-src 'self': no inline script, no third-party script; the bundles only.
#   style-src 'unsafe-inline': MUI (Emotion) injects its styles in <style> elements; styles cannot run code.
#   img-src data: blob: MUI icons and the preview of an image before upload.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Production, behind HTTPS only (browsers then refuse plain HTTP for a year):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
