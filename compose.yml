name: ecommerce

# "docker compose up -d" starts the database, Keycloak and the observability backend (application run from the IDE
# or ./mvnw spring-boot:run); "docker compose --profile app up -d --build --wait" starts the API container as well.
# Values come from .env (see .env.example): no credential in this file.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USERNAME:?POSTGRES_USERNAME is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      # Loopback only: reachable by the application started on the host, not from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker: mount the parent.
      - postgres-data:/var/lib/postgresql
    networks: [db-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: [app]
    image: ${IMAGE_NAMESPACE:-local}/ecommerce-api:${IMAGE_TAG:-dev}
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:?POSTGRES_USERNAME is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      # Every request traced in development; traces, metrics and logs sent to the collector on the compose network.
      TRACING_SAMPLING_PROBABILITY: "1.0"
      OTEL_TRACES_ENDPOINT: http://otel-lgtm:4318/v1/traces
      OTEL_METRICS_ENDPOINT: http://otel-lgtm:4318/v1/metrics
      OTEL_LOGS_ENDPOINT: http://otel-lgtm:4318/v1/logs
      OTEL_METRICS_STEP: 10s
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      # Actuator (health, info, metrics), loopback only.
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"
    networks: [default, db-net]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # The JVM sizes its heap from this limit (MaxRAMPercentage=60 in the image).
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Keycloak's own database, reachable by Keycloak only.
  keycloak-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    networks: [keycloak-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Identity provider: realm "ecommerce" imported from ./keycloak at first start (an existing realm is never
  # overwritten). Development mode (plain HTTP); production would run "start" behind TLS.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      # Tokens carry the public URL seen by the browser; containers reach Keycloak as keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Placeholders resolved in the realm file at import: no secret in Git.
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?BFF_CLIENT_SECRET is required}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?DEMO_USER_PASSWORD is required}
      SHOP_ADMIN_EMAIL: ${SHOP_ADMIN_EMAIL:?SHOP_ADMIN_EMAIL is required}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks: [default, keycloak-net]
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image has no curl: plain bash on the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Observability backend for development, in one container: OpenTelemetry collector (OTLP), Tempo (traces),
  # Prometheus (metrics), Loki (logs) and Grafana. Not a production setup: no persistence, default admin account.
  otel-lgtm:
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"   # Grafana (admin / admin)
      - "127.0.0.1:4318:4318"                     # OTLP over HTTP, for the application started on the host
    # The dashboard (observability/grafana), provisioned at startup in the "E-commerce" folder.
    volumes:
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ecommerce.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/ecommerce:ro
    # The image's own health check, with a long start period: Grafana can take minutes on a loaded machine.
    healthcheck:
      start_period: 180s
      start_interval: 5s
    restart: unless-stopped

networks:
  # The database is reachable by the API only; the API also joins "default" for its published ports.
  db-net:
  # Keycloak and its database only.
  keycloak-net:

volumes:
  postgres-data:
  keycloak-db-data:
