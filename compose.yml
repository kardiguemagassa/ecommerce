name: ecommerce

# "docker compose up -d" starts the database, Keycloak, the media storage and the observability backend (API run from
# the IDE or ./mvnw spring-boot:run, front-end from npm run dev); "docker compose --profile app up -d --build --wait"
# also starts the API and the web entry point (nginx: front-end, API, media) on http://localhost:8080.
# Stop with "docker compose --profile app down": without the profile, the API and web containers keep running.
# Values come from .env (see .env.example): no credential in this file.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USERNAME:?POSTGRES_USERNAME is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      # Loopback only: reachable by the application started on the host, not from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker: mount the parent.
      - postgres-data:/var/lib/postgresql
    networks: [db-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: [app]
    image: ${IMAGE_NAMESPACE:-local}/ecommerce-api:${IMAGE_TAG:-dev}
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:?POSTGRES_USERNAME is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      # Token keys fetched from Keycloak on the compose network; the issuer stays the public URL written in tokens.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/ecommerce
      # Browser login through the API (BFF): token endpoint on the compose network, secret of ecommerce-bff from .env.
      KEYCLOAK_REALM_URI: http://keycloak:8080/realms/ecommerce
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?BFF_CLIENT_SECRET is required}
      # Every request traced in development; traces, metrics and logs sent to the collector on the compose network.
      TRACING_SAMPLING_PROBABILITY: "1.0"
      OTEL_TRACES_ENDPOINT: http://otel-lgtm:4318/v1/traces
      OTEL_METRICS_ENDPOINT: http://otel-lgtm:4318/v1/metrics
      OTEL_LOGS_ENDPOINT: http://otel-lgtm:4318/v1/logs
      OTEL_METRICS_STEP: 10s
      # Images and avatars: S3 API of the media service on the compose network; browsers read them through nginx.
      MEDIA_ENDPOINT: http://media:8333
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY:?MEDIA_ACCESS_KEY is required}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:?MEDIA_SECRET_KEY is required}
      MEDIA_PUBLIC_URL: /media
    # No API port on the host: browsers and scripts go through the web entry point (nginx) on 8080.
    ports:
      # Actuator (health, info, metrics), loopback only.
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"
    networks: [default, db-net, media-net]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      media:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # The JVM sizes its heap from this limit (MaxRAMPercentage=60 in the image).
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Keycloak's own database, reachable by Keycloak only.
  keycloak-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    networks: [keycloak-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Identity provider: realm "ecommerce" imported from ./keycloak at first start (an existing realm is never
  # overwritten). Development mode (plain HTTP); production would run "start" behind TLS.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      # Tokens carry the public URL seen by the browser; containers reach Keycloak as keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Placeholders resolved in the realm file at import: no secret in Git.
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?BFF_CLIENT_SECRET is required}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?DEMO_USER_PASSWORD is required}
      SHOP_ADMIN_EMAIL: ${SHOP_ADMIN_EMAIL:?SHOP_ADMIN_EMAIL is required}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Login and registration pages in the look of the shop (start-dev: no theme cache, edits show on reload).
      - ./keycloak/themes/comptoir:/opt/keycloak/themes/comptoir:ro
    networks: [default, keycloak-net]
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image has no curl: plain bash on the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Single entry point of the shop (nginx): the React front-end, /api, the browser login and /media, on one origin.
  web:
    profiles: [app]
    image: ${IMAGE_NAMESPACE:-local}/ecommerce-web:${IMAGE_TAG:-dev}
    build: ./frontend
    environment:
      KEYCLOAK_ORIGIN: http://localhost:${KEYCLOAK_PORT:-8180}
    ports:
      # Loopback only, like every port of this file.
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks: [default, media-net]
    depends_on:
      api:
        condition: service_healthy
      media:
        condition: service_healthy
    # Read-only file system: only the rendered configuration (owned by the nginx user, uid 101) and the temporary
    # files of nginx are writable, in memory.
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  # Media storage (product images, avatars): SeaweedFS in single-process mode ("weed mini"), S3 API on port 8333.
  # The credentials from .env are its only identity (administrator); the API makes the bucket's objects publicly
  # readable at startup (bucket policy: GetObject only). Production: any S3 provider, same API.
  media:
    image: chrislusf/seaweedfs:4.52
    command: ["mini", "-dir=/data", "-webdav=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      AWS_ACCESS_KEY_ID: ${MEDIA_ACCESS_KEY:?MEDIA_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_SECRET_KEY:?MEDIA_SECRET_KEY is required}
      S3_BUCKET: ecommerce-media
    ports:
      # Loopback only: the API started on the host, and browsers reading the images.
      - "127.0.0.1:${MEDIA_PORT:-8333}:8333"
    volumes:
      - media-data:/data
    networks: [default, media-net]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # Observability backend for development, in one container: OpenTelemetry collector (OTLP), Tempo (traces),
  # Prometheus (metrics), Loki (logs) and Grafana. Not a production setup: no persistence, default admin account.
  otel-lgtm:
    image: grafana/otel-lgtm:0.39.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"   # Grafana (admin / admin)
      - "127.0.0.1:4318:4318"                     # OTLP over HTTP, for the application started on the host
    # The dashboard (observability/grafana), provisioned at startup in the "E-commerce" folder.
    volumes:
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ecommerce.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/ecommerce:ro
    # The image's own health check, with a long start period: Grafana can take minutes on a loaded machine.
    healthcheck:
      start_period: 180s
      start_interval: 5s
    restart: unless-stopped

networks:
  # The database is reachable by the API only; the API also joins "default" for its published ports.
  db-net:
  # Keycloak and its database only.
  keycloak-net:
  # The media storage, the API and the web entry point.
  media-net:

volumes:
  postgres-data:
  keycloak-db-data:
  media-data:
