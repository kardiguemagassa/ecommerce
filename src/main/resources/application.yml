spring:
  application:
    name: ecommerce

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    web:
      pageable:
        max-page-size: 100

  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100

logging:
  level:
    org.hibernate.SQL: DEBUG

