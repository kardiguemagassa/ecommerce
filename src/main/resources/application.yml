spring:
  application:
    name: ecommerce

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  # Schema owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities
  # Keycloak access tokens: keys from the JWK set URI (internal Keycloak URL in containers), issuer and audience
  # checked against the public URL the browser and the tokens use.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
          audiences: ecommerce-api
      # Backend for Frontend: the browser signs in through the API (confidential client, secret from .env).
      # Endpoints set one by one, no issuer discovery: the browser reaches Keycloak on its public URL, the API on the
      # internal one (containers); the realm roles come in the ID token (claim "roles", mapper of the client).
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ecommerce-bff
            client-secret: ${BFF_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_REALM_URI:http://localhost:8180/realms/ecommerce}/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
            user-name-attribute: sub

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    web:
      pageable:
        max-page-size: 100

  # Image uploads: the largest kind (product image, 2 MB); avatars are limited to 1 MB by the application.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100

# Browser session of the BFF: HttpOnly cookie, never sent by cross-site requests (SameSite=Lax); Secure behind HTTPS.
server:
  # Behind nginx: scheme, host and port of the browser from X-Forwarded-*, trusted from private networks only
  # (Tomcat RemoteIpValve). OAuth2 redirect URIs and the logout URL are built on them.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Traces over OTLP (HTTP) to the OpenTelemetry collector: Grafana Tempo in development (compose service otel-lgtm).
  tracing:
    sampling:
      # 10 % unless told otherwise (production); compose and .env.example set 100 % for development.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    # Logs over OTLP as well (Loki in development), each record with the trace and span ids of the current span.
    logging:
      export:
        otlp:
          endpoint: ${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  # Metrics pushed over OTLP (Prometheus in development), instead of being scraped from /actuator/prometheus.
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        # Push interval: 1 minute by default (production), 10 s in compose for live dashboards.
        step: ${OTEL_METRICS_STEP:1m}

# Backend for Frontend: where the browser lands after login and logout. The React front-end (v2.0.0) will be the
# target; until then, the session endpoint shows the result.
app:
  bff:
    # Relative: the address the browser used (nginx on 8080, Vite on 5173); absolute for a front-end on another origin.
    front-url: ${BFF_FRONT_URL:/}
    end-session-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}/protocol/openid-connect/logout

  # Product images and avatars: object storage over the S3 API (SeaweedFS in development, compose service "media").
  # The database keeps object keys; browsers read the objects at public-url (the bucket here, /media behind nginx).
  media:
    endpoint: ${MEDIA_ENDPOINT:http://localhost:8333}
    region: ${MEDIA_REGION:us-east-1}
    bucket: ${MEDIA_BUCKET:ecommerce-media}
    access-key: ${MEDIA_ACCESS_KEY:}
    secret-key: ${MEDIA_SECRET_KEY:}
    public-url: ${MEDIA_PUBLIC_URL:http://localhost:8333/ecommerce-media}
    # Creates the bucket and its public-read policy at startup: development only, false in production.
    provision: ${MEDIA_PROVISION:true}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    version: openapi_3_0
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    # "Authorize" signs in with Keycloak (public client, authorization code with PKCE); the token stays in Swagger UI.
    oauth:
      client-id: ecommerce-swagger
      use-pkce-with-authorization-code-grant: true
      scopes: openid
    operations-sorter: method
    tags-sorter: alpha
  paths-to-match: /api/**
  default-produces-media-type: application/json

# SQL spans: queries only (no connection or result-set spans), never the parameter values (personal data).
jdbc:
  includes: query
  datasource-proxy:
    include-parameter-values: false

