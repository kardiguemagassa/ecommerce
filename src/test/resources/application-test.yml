# Real PostgreSQL through the Testcontainers JDBC driver: one container per test JVM,
# shared by every Spring context (TC_DAEMON keeps it up until the JVM exits).
# Flyway applies the same migrations as in production, then Hibernate validates the schema.
spring:
  datasource:
    url: jdbc:tc:postgresql:18-alpine:///ecommerce?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  test:
    database:
      replace: none

app:
  notification:
    simulated-delay: PT0S

management:
  server:
    port: 0

logging:
  level:
    org.hibernate.SQL: warn
